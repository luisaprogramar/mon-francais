<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d989ad">
<title>Mon Français — Meu plano de 90 dias</title>
<style>
:root{--pink:#d989ad;--pink-dark:#a94d78;--pink-soft:#f9e8ef;--pink-mid:#efc4d5;--ink:#493743;--muted:#927f8a;--bg:#fffafd;--line:#f0e3e9;--card:#fff;--shadow:0 8px 28px #9d607515}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:28px 18px;position:sticky;top:0;height:100vh}.brand{font-family:Georgia,serif;font-size:28px;color:var(--pink-dark);margin:0 10px}.brand-sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin:2px 10px 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#76616d;text-align:left;padding:11px 13px;border-radius:12px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:var(--pink-soft);color:var(--pink-dark)}.nav .ico{width:22px;text-align:center}.side-note{position:absolute;bottom:22px;left:20px;right:20px;background:#fff6fa;border-radius:15px;padding:14px;font-size:12px;color:var(--muted)}main{padding:34px clamp(18px,4vw,58px);max-width:1250px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--pink-dark);font-weight:700}.date{color:var(--muted);font-size:13px}.hero{background:linear-gradient(120deg,#faeaf1,#fff5f8 65%,#f8edf3);border:1px solid #f4dce7;border-radius:24px;padding:28px;margin-bottom:22px;position:relative;overflow:hidden}.hero h1{font:36px/1.15 Georgia,serif;margin:7px 0;color:#75445d}.hero p{margin:0;color:#876b79;max-width:650px}.hero-mark{position:absolute;right:28px;top:12px;font-size:65px;opacity:.35}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0 25px}.stat,.panel,.task-card,.phase-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font:27px Georgia,serif;color:var(--pink-dark)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 13px}.section-head h2{font:25px Georgia,serif;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:10px 15px;background:var(--pink-dark);color:white;font-weight:650}.btn.secondary{background:var(--pink-soft);color:var(--pink-dark)}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.task{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{accent-color:var(--pink-dark);width:18px;height:18px;margin-top:3px}.task.done .task-title{text-decoration:line-through;color:#aa9aa3}.task-title{font-weight:650}.task-meta{font-size:12px;color:var(--muted)}.progress{height:8px;border-radius:20px;background:#f4e9ee;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);border-radius:20px}.pill{display:inline-block;border-radius:30px;padding:3px 9px;background:var(--pink-soft);color:var(--pink-dark);font-size:11px;font-weight:700}.muted{color:var(--muted)}.day-list{display:grid;gap:9px}.day-row{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.day-num{width:42px;height:42px;border-radius:12px;background:var(--pink-soft);color:var(--pink-dark);display:grid;place-items:center;font-weight:750}.day-row .grow{flex:1;min-width:0}.day-row h3{font-size:14px;margin:0}.day-row p{font-size:12px;color:var(--muted);margin:2px 0}.day-row button{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 10px;color:var(--pink-dark)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{border:1px solid var(--line);background:white;border-radius:30px;padding:8px 13px;color:var(--muted)}.tabs button.active{background:var(--pink-dark);color:white;border-color:var(--pink-dark)}.field{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);width:100%}.resource{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.resource a{color:var(--pink-dark);font-weight:650;text-decoration:none}.resource a:hover{text-decoration:underline}.week-card{padding:16px;border:1px solid var(--line);border-radius:15px;background:white}.week-card h3{margin:0 0 5px;font:19px Georgia,serif}.week-card p{margin:5px 0;color:var(--muted);font-size:13px}.week-card ul{padding-left:19px;margin:10px 0;font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);display:grid;place-items:center;font-size:12px}.cal-day.done{background:#f4dce7;border-color:#e9bfd0;color:#874765}.cal-day.today{outline:2px solid var(--pink-dark)}.empty{padding:30px;text-align:center;color:var(--muted)}.footer{margin:40px 0 10px;text-align:center;color:#b39eaa;font-size:11px}.mobile-top{display:none}
@media(max-width:800px){.app{display:block}.sidebar{height:auto;position:sticky;z-index:5;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:23px}.brand-sub{display:none}.side-note{display:none}.nav{display:flex;overflow:auto;margin-top:9px}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.nav .ico{display:none}main{padding:22px 15px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.hero-mark{right:12px;font-size:48px}.topline{margin-bottom:17px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <h1 class="brand">Mon Français ♡</h1><div class="brand-sub">MEU PROJETO DE 90 DIAS</div>
  <nav class="nav" id="nav">
    <button data-page="home" class="active"><span class="ico">⌂</span>Meu dia</button>
    <button data-page="plan"><span class="ico">▦</span>Cronograma</button>
    <button data-page="weeks"><span class="ico">▤</span>Semanas</button>
    <button data-page="content"><span class="ico">▧</span>Conteúdos</button>
    <button data-page="vocab"><span class="ico">♡</span>Vocabulário</button>
    <button data-page="resources"><span class="ico">▶</span>Materiais e canais</button>
    <button data-page="tests"><span class="ico">✓</span>Avaliações</button>
    <button data-page="progress"><span class="ico">↗</span>Meu progresso</button>
    <button data-page="settings"><span class="ico">⚙</span>Configurações</button>
  </nav>
  <div class="side-note">“Un petit pas chaque jour.”<br><b>Um pequeno passo todos os dias.</b></div>
</aside>
<main>
  <div class="topline"><div><div class="eyebrow">BONJOUR, APPRENANTE !</div><div class="date" id="todayLabel"></div></div><button class="btn secondary" id="jumpToday">Ir para hoje ↗</button></div>
  <div id="view"></div>
  <div class="footer">MON FRANÇAIS · Seu espaço pessoal de organização · Os dados ficam salvos neste navegador.</div>
</main>
</div>
<script>
const phases=[
{n:1,title:"Primeiros passos",range:"Dias 1–15",level:"Pré-A1",goal:"Familiarização com o idioma",grammar:["Alfabeto e sons do francês","Acentos e relação entre escrita e pronúncia","Artigos definidos e indefinidos","Gênero e número dos substantivos","Pronomes pessoais sujeitos","Être, avoir e s’appeler","Frases afirmativas e negação ne…pas","Perguntas básicas: qui, où, comment, quand"],vocab:["Saudações e apresentações","Países e nacionalidades","Números, idade e informações pessoais","Família e profissões","Objetos pessoais, cores e características"],skills:"Soletrar, cumprimentar, apresentar-se e fazer perguntas pessoais."},
{n:2,title:"Construção da base",range:"Dias 16–30",level:"A1",goal:"Comunicação cotidiana básica",grammar:["Presente do indicativo","Verbos regulares em -ER","Aller, faire, prendre e vouloir","Estruturas interrogativas e est-ce que","Artigos partitivos: du, de la, de l’, des","Preposições de lugar e contrações","Adjetivos possessivos","Expressões de frequência"],vocab:["Rotina e atividades diárias","Casa, cômodos, móveis e objetos","Alimentação, bebidas e refeições","Cafeteria e restaurante"],skills:"Descrever rotina e casa, falar de preferências e fazer pedidos."},
{n:3,title:"Desenvolvimento A1",range:"Dias 31–45",level:"A1",goal:"Falar de planos e experiências simples",grammar:["Futur proche","Verbos pronominais","Passé composé com avoir e être","Particípio passado","Expressões temporais","Preposições de destino e origem","Conectivos: et, mais, parce que, donc"],vocab:["Horários, calendário e compromissos","Viagens e transportes","Hospedagem e passeios","Acontecimentos e experiências"],skills:"Relatar acontecimentos simples e falar de planos futuros."},
{n:4,title:"Transição para A2",range:"Dias 46–60",level:"A2",goal:"Descrever, comparar e narrar",grammar:["Adjetivos demonstrativos","Pronomes tônicos","Comparativo e superlativo","Imparfait","Diferença entre passé composé e imparfait","Adjetivos e concordância","Expressões de opinião e conectivos temporais"],vocab:["Roupas, compras e aparência","Sentimentos e emoções","Infância, memórias e experiências","Descrições de pessoas e lugares"],skills:"Comparar pessoas e lugares, descrever experiências e falar do passado."},
{n:5,title:"Expansão",range:"Dias 61–75",level:"A2+",goal:"Comunicação mais elaborada",grammar:["Futur simple","Pronomes COD e COI","Pronomes relativos qui, que e où","Obrigação e possibilidade","Il faut, devoir, pouvoir e savoir","Concordância, justificativa e textos mais elaborados"],vocab:["Estudos e vida acadêmica","Trabalho e profissões","Tecnologia e comunicação","Saúde, corpo, cidade e serviços"],skills:"Explicar situações, necessidades e opiniões com mais detalhes."},
{n:6,title:"Consolidação",range:"Dias 76–90",level:"A2+/B1",goal:"Integrar habilidades e ampliar autonomia",grammar:["Conditionnel présent","Hipóteses e estruturas com si","Subordinação de frases","Conectivos argumentativos","Expressões de opinião e justificativa","Revisão integrada dos tempos verbais"],vocab:["Sociedade e cultura","Relacionamentos e vida cotidiana","Meio ambiente e atualidades","Temas abstratos e vocabulário variado"],skills:"Sustentar conversas, justificar opiniões e compreender materiais mais longos."}
];
const vocabWeeks=[
["Saudações e apresentações","Apresentações pessoais"],["Pessoas","Família e profissões"],["Informações pessoais","Números e cores"],["Casa","Móveis e objetos"],["Alimentação","Cafeteria e restaurante"],["Rotina","Horários e calendário"],["Viagens","Transportes e hospedagem"],["Aparência","Roupas e compras"],["Sentimentos","Infância e memórias"],["Estudos","Trabalho e tecnologia"],["Saúde","Cidade e serviços"],["Sociedade","Cultura e relacionamentos"],["Temas diversos","Meio ambiente e atualidades"]];
const skillByDay=["Gramática + vocabulário","Gramática + compreensão oral","Vocabulário + leitura","Gramática + pronúncia","Compreensão oral + escrita","Conversação + aplicação prática","Revisão semanal + teste"];
const topics=[
["Alfabeto, cumprimentos e apresentações","Alfabeto e sons; saudações; expressões de cortesia","Saudações e apresentações","Soletrar o nome e apresentar-se"],
["Artigos, gênero e informações pessoais","Artigos definidos/indefinidos; masculino e feminino; números","Países, nacionalidades e números","Apresentar dados pessoais"],
["Pronomes e verbos essenciais","Pronomes sujeitos; être, avoir, s’appeler; ne…pas","Família, idade e profissões","Descrever a si e a outra pessoa"],
["Presente e rotina","Verbos em -ER; presente; frequência; horas","Rotina e atividades diárias","Descrever um dia típico"],
["Casa e localização","Aller, faire; possessivos; preposições de lugar","Casa, cômodos, móveis e objetos","Descrever sua casa"],
["Alimentação e pedidos","Partitivos; quantidade; vouloir e prendre","Comidas, bebidas, cafeteria e restaurante","Fazer um pedido"],
["Futur proche e planos","Futur proche; verbos pronominais; calendário","Tempo, compromissos e lazer","Falar dos planos"],
["Passé composé e viagens","Avoir/être; particípio; marcadores temporais","Viagens e transportes","Contar uma experiência"],
["Comparações e descrições","Demonstrativos; comparativo; superlativo","Roupas, compras e aparência","Comparar produtos e lugares"],
["Imparfait e memórias","Imparfait; contraste com passé composé","Infância, sentimentos e memórias","Contar uma lembrança"],
["Futuro e complementos","Futur simple; COD e COI","Estudos, trabalho e tecnologia","Explicar projetos"],
["Relativos e situações práticas","Qui, que, où; devoir, pouvoir, savoir; il faut","Saúde, cidade e serviços","Explicar um problema"],
["Opiniões, hipóteses e consolidação","Conditionnel; si; conectivos; revisão geral","Sociedade, cultura e meio ambiente","Defender uma opinião simples"]
];
const dayTitles=["Introdução ao francês e objetivos","Alfabeto e nomes das letras","Sons, acentos e pronúncia","Saudações e expressões de cortesia","Apresentar-se: nome e origem","Artigos definidos e indefinidos","Revisão e miniavaliação 1","Gênero dos substantivos","Singular e plural","Pronomes pessoais sujeitos","Être: identidade e descrição","Avoir: idade e características","Números e informações pessoais","Família e profissões","Revisão e miniavaliação 2","Verbos regulares em -ER","Presente: frases afirmativas","Negação ne…pas","Perguntas com est-ce que","Verbos aller e faire","Rotina e frequência","Revisão e miniavaliação 3","A casa e seus cômodos","Móveis e objetos","Adjetivos possessivos","Preposições de lugar","Descrever onde as coisas estão","Leitura: descrição de uma casa","Revisão e miniavaliação 4","Alimentos e bebidas","Artigos partitivos","Expressões de quantidade","Pedir em uma cafeteria","Verbos vouloir e prendre","Diálogo em restaurante","Revisão e miniavaliação 5","Horas e calendário","Futur proche","Verbos pronominais","Rotina e compromissos","Atividades de lazer","Falar sobre planos","Revisão e miniavaliação 6","Passé composé com avoir","Particípios passados frequentes","Passé composé com être","Viagens e transportes","Marcadores temporais do passado","Relatar uma viagem","Revisão e miniavaliação 7","Adjetivos demonstrativos","Pronomes tônicos","Comparativo","Superlativo","Roupas e compras","Descrever e comparar","Revisão e miniavaliação 8","Imparfait: formação e uso","Passé composé x imparfait","Descrever a infância","Sentimentos e emoções","Narrar uma lembrança","Leitura de narrativa curta","Revisão e miniavaliação 9","Futur simple: formação","Futur simple: usos","Pronomes COD","Pronomes COI","Estudos e vida acadêmica","Trabalho e tecnologia","Revisão e miniavaliação 10","Pronomes relativos qui e que","Pronome relativo où","Devoir, pouvoir e savoir","Il faut e obrigação","Saúde e corpo","Cidade e serviços","Revisão e miniavaliação 11","Conditionnel présent","Expressar hipóteses com si","Conectivos de argumentação","Concordar e discordar","Sociedade e cultura","Meio ambiente e atualidades","Revisão e miniavaliação 12","Revisão: presente e futuro","Revisão: passado","Revisão: pronomes e artigos","Compreensão oral integrada","Leitura e interpretação","Produção escrita e oral","Avaliação final integrada"];
function phaseFor(d){return d<=15?0:d<=30?1:d<=45?2:d<=60?3:d<=75?4:5}
function weekFor(d){return Math.min(12,Math.floor((d-1)/7))}
function makeDay(d){let w=weekFor(d),p=phaseFor(d),dow=(d-1)%7, title=dayTitles[d-1]||"Consolidação e prática";let weekly=topics[w];let isReview=dow===6||[15,30,45,60,75,90].includes(d);let tasks;
if(isReview) tasks=[["Revisar os conteúdos gramaticais da semana",20,"Revisão"],["Revisar o vocabulário temático",15,"Vocabulário"],["Fazer uma atividade de compreensão oral",15,"Áudio ou vídeo"],["Produzir frases, texto ou fala curta",15,"Produção"],["Realizar o teste semanal",10,"Autoavaliação"]];
else tasks=[[`Estudar: ${title}`,20,"Aula indicada"],[`Vocabulário: ${vocabWeeks[w][0]}`,15,"Lista temática"],["Compreensão oral relacionada ao tema",15,"Vídeo ou áudio"],["Leitura ou escrita aplicada",15,"Atividade prática"],[dow===5?"Praticar uma conversa simulada":"Pronúncia e revisão espaçada",10,dow===5?"Produção oral":"Revisão"]];
return {day:d,week:w+1,phase:p+1,title,focus:skillByDay[dow],grammar:weekly[1],vocab:vocabWeeks[w][0]+" · "+vocabWeeks[w][1],skill:weekly[2],review:isReview,tasks};}
const days=Array.from({length:90},(_,i)=>makeDay(i+1));
const defaultResources=[
{name:"Os Franceses Tomam Banho",type:"Canal principal",url:"https://www.youtube.com/results?search_query=Os+Franceses+Tomam+Banho+frances",note:"Localizar aulas por assunto; substituir por links diretos dos vídeos escolhidos."},
{name:"Français avec Pierre",type:"Canal complementar",url:"https://www.youtube.com/@FrancaisavecPierre",note:"Gramática, vocabulário e compreensão."},
{name:"Francês com Mademoiselle",type:"Canal complementar",url:"https://www.youtube.com/results?search_query=Franc%C3%AAs+com+Mademoiselle",note:"Aulas para iniciantes; conferir o canal correto antes de cadastrar."},
{name:"TV5MONDE – Apprendre le français",type:"Exercícios e compreensão",url:"https://apprendre.tv5monde.com/",note:"Atividades por nível e compreensão oral."},
{name:"RFI – Le français facile",type:"Áudios e notícias",url:"https://francaisfacile.rfi.fr/",note:"Áudios, transcrições e conteúdos em francês."},
{name:"Lawless French",type:"Gramática e exercícios",url:"https://www.lawlessfrench.com/",note:"Explicações e exercícios de gramática."},
{name:"Le Point du FLE",type:"Biblioteca de exercícios",url:"https://www.lepointdufle.net/",note:"Atividades organizadas por assunto."},
{name:"Forvo",type:"Pronúncia",url:"https://forvo.com/languages/fr/",note:"Ouvir pronúncia de palavras por falantes."}
];
let state=load();
function load(){try{return JSON.parse(localStorage.getItem("monFrancais90"))||{start:new Date().toISOString().slice(0,10),completed:{},resources:defaultResources,notes:{}}}catch(e){return {start:new Date().toISOString().slice(0,10),completed:{},resources:defaultResources,notes:{}}}}
function save(){localStorage.setItem("monFrancais90",JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function dateForDay(d){let x=new Date(state.start+"T12:00:00");x.setDate(x.getDate()+d-1);return x}
function fmtDate(x){return x.toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"})}
function completedCount(){return Object.values(state.completed).filter(Boolean).length}
function dayDone(d){return (state.completed[d]||[]).length===5}
function currentDay(){let start=new Date(state.start+"T00:00:00"),now=new Date();return Math.max(1,Math.min(90,Math.floor((now-start)/86400000)+1))}
let selectedDay=currentDay(),page="home";
function go(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("jumpToday").onclick=()=>{selectedDay=currentDay();go("home")};
document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function taskHTML(day){let done=state.completed[day.day]||[];return day.tasks.map((t,i)=>`<label class="task ${done.includes(i)?"done":""}"><input type="checkbox" data-day="${day.day}" data-task="${i}" ${done.includes(i)?"checked":""}><span><span class="task-title">${esc(t[0])}</span><br><span class="task-meta">${t[1]} min · ${esc(t[2])}</span></span></label>`).join("")}
function render(){let v=document.getElementById("view");if(page==="home")v.innerHTML=home();if(page==="plan")v.innerHTML=plan();if(page==="weeks")v.innerHTML=weeks();if(page==="content")v.innerHTML=content();if(page==="vocab")v.innerHTML=vocab();if(page==="resources")v.innerHTML=resources();if(page==="tests")v.innerHTML=tests();if(page==="progress")v.innerHTML=progress();if(page==="settings")v.innerHTML=settings();bind();}
function home(){let d=days[selectedDay-1],done=(state.completed[d.day]||[]).length,pct=Math.round(completedCount()/450*100);return `<section class="hero"><div class="hero-mark">✿</div><div class="eyebrow">JOUR ${String(d.day).padStart(2,"0")} · ${esc(d.focus.toUpperCase())}</div><h1>Bonjour ! ♡</h1><p>Um pequeno passo por dia. Seu plano de francês está organizado — agora é só seguir o próximo passo.</p></section><div class="stats"><div class="stat"><small>Dia do plano</small><strong>${d.day}/90</strong></div><div class="stat"><small>Tarefas concluídas hoje</small><strong>${done}/5</strong></div><div class="stat"><small>Progresso geral</small><strong>${pct}%</strong></div><div class="stat"><small>Etapa atual</small><strong>${d.phase}/6</strong></div></div><div class="section-head"><div><h2>Seu plano de hoje</h2><p>${fmtDate(dateForDay(d.day))} · ${esc(d.title)}</p></div><span class="pill">${phases[d.phase-1].level}</span></div><div class="panel"><div class="progress"><span style="width:${done/5*100}%"></span></div>${taskHTML(d)}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="muted" style="font-size:12px">${done===5?"Dia concluído! Bravo !":"Marque cada tarefa ao terminar."}</span><button class="btn secondary" onclick="selectedDay=${Math.min(90,d.day+1)};render()">Próximo dia →</button></div></div><div class="section-head"><div><h2>Seu percurso</h2><p>As seis etapas do programa</p></div><button class="btn ghost" onclick="go('plan')">Ver cronograma</button></div><div class="grid">${phases.map((p,i)=>`<div class="week-card"><span class="pill">${p.level}</span><h3>${p.title}</h3><p>${p.range} · ${p.goal}</p><div class="progress"><span style="width:${Math.min(100,Math.max(0,(completedCount()/450)*100))}%"></span></div></div>`).join("")}</div>`}
function plan(){return `<div class="section-head"><div><h2>Cronograma de 90 dias</h2><p>Selecione um dia para consultar as tarefas.</p></div><span class="pill">${completedCount()}/450 tarefas</span></div><div class="panel"><div class="section-head" style="margin-top:0"><div><b>Calendário</b><p>Os dias concluídos ficam destacados.</p></div></div><div class="calendar">${["D","S","T","Q","Q","S","S"].map(x=>`<b class="muted" style="text-align:center">${x}</b>`).join("")}${days.map(d=>`<button class="cal-day ${dayDone(d.day)?"done":""} ${selectedDay===d.day?"today":""}" onclick="selectedDay=${d.day};go('home')" title="${esc(d.title)}">${d.day}</button>`).join("")}</div></div><div class="section-head"><div><h2>Todos os dias</h2><p>Planejamento diário e temas.</p></div></div><div class="day-list">${days.map(d=>`<div class="day-row"><div class="day-num">${String(d.day).padStart(2,"0")}</div><div class="grow"><h3>${esc(d.title)}</h3><p>Semana ${d.week} · ${esc(d.vocab)} · ${fmtDate(dateForDay(d.day))}</p></div><span class="pill">${dayDone(d.day)?"Concluído":phases[d.phase-1].level}</span><button onclick="selectedDay=${d.day};go('home')">Abrir</button></div>`).join("")}</div>`}
function weeks(){return `<div class="section-head"><div><h2>Planejamento semanal</h2><p>Objetivos, conteúdos e habilidades de cada semana.</p></div></div><div class="grid">${topics.map((t,i)=>`<article class="week-card"><span class="pill">Semana ${i+1} · Dias ${i*7+1}–${Math.min(90,i*7+7)}</span><h3>${esc(t[0])}</h3><p><b>Gramática:</b> ${esc(t[1])}</p><p><b>Vocabulário:</b> ${esc(vocabWeeks[i][0])} e ${esc(vocabWeeks[i][1])}</p><p><b>Habilidade:</b> ${esc(t[2])}</p><button class="btn secondary" onclick="selectedDay=${i*7+1};go('home')">Ver primeira tarefa</button></article>`).join("")}</div>`}
function content(){let all=[...new Set(phases.flatMap(p=>p.grammar))];return `<div class="section-head"><div><h2>Biblioteca de conteúdos</h2><p>Conteúdos gramaticais distribuídos na ordem do programa.</p></div></div><div class="grid">${phases.map((p,i)=>`<article class="week-card"><span class="pill">${p.level} · ${p.range}</span><h3>${p.title}</h3><ul>${p.grammar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p><b>Habilidades:</b> ${esc(p.skills)}</p></article>`).join("")}</div>`}
function vocab(){return `<div class="section-head"><div><h2>Vocabulário temático</h2><p>Os temas seguem o cronograma para ampliar seu repertório gradualmente.</p></div></div><div class="grid">${vocabWeeks.map((t,i)=>`<article class="week-card"><span class="pill">Semana ${i+1}</span><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p><p class="muted">Estude substantivos com artigo, verbos relacionados, expressões e frases contextualizadas.</p><button class="btn secondary" onclick="selectedDay=${i*7+1};go('home')">Ir para semana</button></article>`).join("")}</div>`}
function resources(){return `<div class="section-head"><div><h2>Materiais e canais</h2><p>Biblioteca de recursos. Confira e cadastre links diretos das aulas que escolher.</p></div></div><div class="panel"><p class="muted" style="font-size:13px">Os links de busca são pontos de partida, não uma seleção de vídeos já verificados. Associe cada aula ao dia correspondente para manter o cronograma preciso.</p>${state.resources.map((r,i)=>`<div class="resource"><div><b>${esc(r.name)}</b><div class="task-meta">${esc(r.type)} · ${esc(r.note||"")}</div></div><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir ↗</a></div>`).join("")}</div><div class="section-head"><div><h2>Adicionar recurso</h2><p>Inclua um vídeo, site, podcast ou material específico.</p></div></div><div class="panel"><form id="resourceForm" class="grid"><input class="field" name="name" placeholder="Nome do recurso" required><input class="field" name="type" placeholder="Categoria (ex.: pronúncia)"><input class="field" name="url" type="url" placeholder="https://..." required><input class="field" name="note" placeholder="Observação (opcional)"><button class="btn" type="submit">Adicionar à biblioteca</button></form></div>`}
function tests(){let checkpoints=[15,30,45,60,75,90];return `<div class="section-head"><div><h2>Avaliações e checkpoints</h2><p>Verifique o que consegue fazer, não apenas o que assistiu.</p></div></div><div class="grid">${checkpoints.map((d,i)=>`<article class="week-card"><span class="pill">Dia ${d}</span><h3>${["Primeira avaliação","A1 inicial","Avaliação A1","Transição para A2","Avaliação A2","Avaliação final integrada"][i]}</h3><p>${["Apresentação pessoal, pronúncia e frases básicas.","Gramática básica, perguntas, rotina e diálogos simples.","Passado, futuro próximo, leitura e escrita.","Narrativas, comparações e compreensão oral.","Conversação, textos e estruturas intermediárias.","Quatro habilidades: escuta, leitura, fala e escrita."][i]}</p><p><b>Critério:</b> registre evidências do que consegue realizar sem consultar suas anotações.</p><textarea class="field" rows="3" placeholder="Anotações da avaliação..." data-note="test${d}">${esc(state.notes["test"+d]||"")}</textarea></article>`).join("")}</div><p class="muted" style="font-size:12px">As avaliações são autoavaliações de acompanhamento, não certificações oficiais de nível CEFR.</p>`}
function progress(){let n=completedCount(),pct=Math.round(n/450*100),daysDone=days.filter(d=>dayDone(d.day)).length;let weeksDone=topics.map((_,i)=>{let a=i*7+1,b=Math.min(90,i*7+7);return days.filter(d=>d.day>=a&&d.day<=b&&dayDone(d.day)).length});return `<div class="section-head"><div><h2>Meu progresso</h2><p>Acompanhe sua consistência ao longo dos 90 dias.</p></div></div><div class="stats"><div class="stat"><small>Tarefas concluídas</small><strong>${n}/450</strong></div><div class="stat"><small>Dias completos</small><strong>${daysDone}/90</strong></div><div class="stat"><small>Progresso</small><strong>${pct}%</strong></div><div class="stat"><small>Horas registradas*</small><strong>${(n*0.25).toFixed(1)}h</strong></div></div><div class="panel"><b>Progresso geral</b><p class="muted" style="font-size:12px">Calculado pelas tarefas marcadas como concluídas.</p><div class="progress"><span style="width:${pct}%"></span></div><h2 style="font:28px Georgia,serif;color:var(--pink-dark)">${pct}%</h2></div><div class="section-head"><div><h2>Consistência por semana</h2><p>Dias em que todas as tarefas foram concluídas.</p></div></div><div class="panel">${weeksDone.map((n,i)=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>Semana ${i+1}</b><span class="muted">${n}/7 dias completos</span></div><div class="progress"><span style="width:${n/7*100}%"></span></div></div>`).join("")}<p class="muted" style="font-size:11px">*Estimativa aproximada de 15 minutos por tarefa marcada. Ajuste essa métrica futuramente para registrar o tempo real.</p></div>`}
function settings(){return `<div class="section-head"><div><h2>Configurações</h2><p>Personalize o início e cuide dos seus dados.</p></div></div><div class="panel"><label><b>Data de início do plano</b><p class="muted" style="font-size:12px">O calendário de 90 dias será calculado a partir desta data.</p><input class="field" style="max-width:260px" type="date" id="startDate" value="${state.start}"></label><p style="margin-top:18px"><b>Meta de estudo</b><br><span class="muted">1h a 1h30 por dia · 7 dias por semana · objetivo de desenvolvimento rumo ao B1.</span></p><div class="section-head"><div><h2 style="font-size:19px">Gerenciar dados</h2><p>O progresso fica salvo apenas neste navegador.</p></div></div><button class="btn secondary" id="export">Exportar meu progresso (JSON)</button> <button class="btn ghost" id="reset">Zerar progresso</button></div><div class="panel" style="margin-top:14px"><b>Sobre a meta B1</b><p class="muted">Atingir B1 partindo do zero em 90 dias, com cerca de 90–135 horas, é uma meta muito ambiciosa e não pode ser garantida. Use os checkpoints para identificar o nível real alcançado. O plano organiza o estudo, mas não substitui prática com falantes, feedback e avaliação externa.</p></div>`}
function bind(){document.querySelectorAll('input[type="checkbox"][data-day]').forEach(el=>el.addEventListener("change",()=>{let d=el.dataset.day,t=Number(el.dataset.task);state.completed[d]=state.completed[d]||[];if(el.checked&&!state.completed[d].includes(t))state.completed[d].push(t);if(!el.checked)state.completed[d]=state.completed[d].filter(x=>x!==t);save();render()}));document.getElementById("resourceForm")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);state.resources.push({name:f.get("name"),type:f.get("type")||"Outro",url:f.get("url"),note:f.get("note")});save();render()});document.querySelectorAll("textarea[data-note]").forEach(el=>el.addEventListener("change",()=>{state.notes[el.dataset.note]=el.value;save()}));document.getElementById("startDate")?.addEventListener("change",e=>{state.start=e.target.value;save();selectedDay=currentDay();render()});document.getElementById("export")?.addEventListener("click",()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mon-francais-progresso.json";a.click();URL.revokeObjectURL(a.href)});document.getElementById("reset")?.addEventListener("click",()=>{if(confirm("Tem certeza? Isso apagará as tarefas concluídas e anotações deste navegador.")){state.completed={};state.notes={};save();render()}})}
render();
</script>
</body></html>
